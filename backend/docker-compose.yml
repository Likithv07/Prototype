version: '3.8'

services:
  # -------------------------------------------------------------
  # PostgreSQL 16 with PostGIS 3.4 Spatial Extension
  # -------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: bhoomi_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhoomi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-bhoomi_setu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhoomi_user} -d ${POSTGRES_DB:-bhoomi_setu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Redis 7 In-Memory Cache and Celery Message Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bhoomi_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # BhoomiSetu FastAPI Modular Monolith Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhoomi_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    environment:
      PROJECT_NAME: "BhoomiSetu - Land Acquisition & Management Platform"
      ENVIRONMENT: "development"
      DEBUG: "True"
      API_V1_STR: "/api/v1"
      SECRET_KEY: ${SECRET_KEY:-insecure-secret-key-change-in-production-min-32-chars-long}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]'
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bhoomi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-bhoomi_setu_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bhoomi_user}:${POSTGRES_PASSWORD:-bhoomi_secure_password}@db:5432/${POSTGRES_DB:-bhoomi_setu_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-bhoomi_user}:${POSTGRES_PASSWORD:-bhoomi_secure_password}@db:5432/${POSTGRES_DB:-bhoomi_setu_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: bhoomi_postgres_data
  redis_data:
    name: bhoomi_redis_data

